# Local cluster for the shopping stack: kind v0.33.0, one node, Kubernetes v1.34.11.
# kind's default network (kindnet) enforces NetworkPolicy; Docker Desktop's
# kubeadm cluster registered the policy but did not enforce it.
# Create: kind create cluster --config kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopping
# Read registry mirrors from certs.d, so localhost:5000 inside the node can
# point to the registry container (deploy.sh writes hosts.toml).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    # Envoy's Service uses these NodePorts (manifests/70-gateway.yaml);
    # the host reaches the Gateway at localhost:8080 / localhost:8443.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
