---
# Beat stays at one replica so scheduled tasks are not sent twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: shopping
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      # Beat reads its schedule from PostgreSQL (DatabaseScheduler) and exits
      # with code 1 if the DB is down at start. Wait for the DB first.
      initContainers:
        - name: wait-for-db
          image: shopping:9836d194
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT"; do echo waiting for db; sleep 2; done
          envFrom:
            - configMapRef:
                name: shopping-config
      containers:
        - name: beat
          image: shopping:9836d194
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - myproject
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          # Idle use measured 2026-11-08: about 1m CPU, 144Mi memory.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
