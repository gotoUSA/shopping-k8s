apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-main
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-main
  template:
    metadata:
      labels:
        app: celery-main
    spec:
      containers:
        - name: worker
          image: shopping:9836d194
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - myproject
            - worker
            - -n
            - main@%h
            - -l
            - info
            - --concurrency=2
            - -Q
            - default,payment_critical,order_processing,points,notifications
            - --prefetch-multiplier=1
          # Idle use measured 2026-11-08: about 2m CPU, 232Mi memory.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-external
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
