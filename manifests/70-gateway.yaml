# Traffic from outside the cluster goes through the Gateway API, served by
# Envoy Gateway (addons/envoy-gateway-v1.9.3-install.yaml).
# Not an Ingress: the Ingress NGINX repository is archived (last release
# 2026-03-19), and the Gateway API is the maintained successor.
# Docker Desktop exposes the Envoy LoadBalancer Service on localhost:80/443.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopping
  namespace: shopping
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    # TLS ends here; the API gets plain HTTP with X-Forwarded-Proto: https.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: shopping-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopping-api
  namespace: shopping
spec:
  parentRefs:
    - name: shopping
  hostnames:
    - localhost
  rules:
    - backendRefs:
        - name: shopping-api
          port: 8000
