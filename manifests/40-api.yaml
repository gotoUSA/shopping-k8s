apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-api
  namespace: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-api
  template:
    metadata:
      labels:
        app: shopping-api
    spec:
      # Allow the 10-second preStop wait plus gunicorn's graceful shutdown.
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: shopping:9836d194
          imagePullPolicy: Never
          # Keep listening while Service rules stop sending new connections.
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          command: [gunicorn, "myproject.wsgi:application", -c, gunicorn.conf.py]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
          # Probes reach the pod by IP, which ALLOWED_HOSTS rejects, so set Host.
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-api
  namespace: shopping
spec:
  selector:
    app: shopping-api
  ports:
    - port: 8000
