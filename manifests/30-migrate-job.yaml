apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: shopping
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shopping:9836d194
          imagePullPolicy: Never
          command: [python, manage.py, migrate, --noinput]
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
