            - external@%h
            - -l
            - info
            - --concurrency=2
            - -Q
            - external_api
            - --prefetch-multiplier=1
          # Idle use measured 2026-11-08: about 2m CPU, 232Mi memory.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: celery_log_override
          volumeMounts:
            - name: celery-log-override
