# The shopping settings set the "celery" logger to propagate: False, and
# under Celery it ends up with no handlers, so Celery's own messages (task
# received/succeeded, broker reconnects, Beat startup errors) are dropped.
# The shopping repository is frozen, so this settings module imports the
# original settings and flips only that value (tests/beat-logging.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: celery-log-override
  namespace: {{ .Release.Namespace }}
data:
  celery_log_override.py: |
    from myproject.settings import *  # noqa: F401, F403

    LOGGING["loggers"]["celery"]["propagate"] = True  # noqa: F405
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-main
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-main
  template:
    metadata:
      labels:
        app: celery-main
    spec:
      containers:
        - name: worker
          image: {{ include "shopping.image" . }}
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - myproject
            - worker
            - -n
            - main@%h
            - -l
            - info
            - --concurrency=2
            - -Q
            - default,payment_critical,order_processing,points,notifications
            - --prefetch-multiplier=1
          # Idle use measured 2026-11-08: about 2m CPU, 232Mi memory.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: shopping-config
            - secretRef:
                name: shopping-secret
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: celery_log_override
          volumeMounts:
            - name: celery-log-override
              mountPath: /code/celery_log_override.py
              subPath: celery_log_override.py
      volumes:
        - name: celery-log-override
          configMap:
            name: celery-log-override
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-external
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-external
  template:
    metadata:
      labels:
        app: celery-external
    spec:
      containers:
        - name: worker
          image: {{ include "shopping.image" . }}
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - myproject
